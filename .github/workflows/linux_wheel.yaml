name: Build Linux wheel

on:
  pull_request:
  push:
    branches:
      - nightly
      - main
      - release/*
    tags:
        - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  schedule:
    # 11:30 UTC, the time pytorch/test-infra's trigger_nightly.yml used to cut
    # our nightly branch for us. Builds main.
    - cron: 30 11 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels to the nightly index, built from the selected branch
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  # The nightly is built straight from the tip of main: the `nightly` branch is no
  # longer cut, because a push to it needs to get past the Meta CLA ruleset. Upload
  # is allowed by `trigger-event: schedule`, not by the branch name.
  source-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Record the commit this build is made from
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          {
            echo "### Source commit"
            echo "[\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "ref \`${GITHUB_REF_NAME}\`, event \`${GITHUB_EVENT_NAME}\`, publish \`${PUBLISH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"


  generate-matrix:
    uses: pytorch/test-infra/.github/workflows/generate_binary_build_matrix.yml@main
    with:
      package-type: wheel
      os: linux
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      with-xpu: disable
      with-rocm: disable
      with-cuda: disable
      build-python-only: "disable"

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
    name: Build and Upload Linux wheel
    uses: pytorch/test-infra/.github/workflows/build_wheels_linux.yml@main
    with:
      repository: pytorch-labs/torchvision-extra-decoders
      # Build the commit of this run (main on the schedule). The reusable workflow's
      # `ref` defaults to the nightly branch, which is no longer cut.
      ref: ${{ github.sha }}
      test-infra-repository: pytorch/test-infra
      test-infra-ref: main
      build-matrix: ${{ needs.generate-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      post-script: packaging/post_build_script.sh
      smoke-test-script: packaging/fake_smoke_test.py
      package-name: torchvision_extra_decoders
      # The reusable workflow uploads only for `schedule`, so a manual run that asks to
      # publish is reported to it as one.
      trigger-event:
        ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && 'schedule' || github.event_name }}
